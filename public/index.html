<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Nia – Kenyan Dating</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #006600;
      --red: #BB0000;
      --black: #1a1a1a;
      --gold: #f5c518;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --border: #e5e7eb;
      --primary: #006600;
      --primary-dark: #004d00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .hidden { display: none !important; }

    #auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #006600 0%, #004d00 40%, #1a1a1a 100%);
      padding: 20px;
      color: white;
    }
    .logo {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .logo span { color: var(--gold); }
    .tagline {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 40px;
      text-align: center;
    }
    .auth-card {
      background: white;
      color: var(--text);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .auth-tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      background: #f3f4f6;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .auth-tabs button.active {
      background: var(--primary);
      color: white;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: border 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: #f3f4f6;
      color: var(--text);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      color: var(--red);
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
    }
    .demo-hint {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    header {
      background: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header .brand {
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--primary);
    }
    header .brand span { color: var(--gold); }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .avatar-small {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    nav.bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 12px;
      z-index: 100;
    }
    nav.bottom button {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      padding: 4px 12px;
    }
    nav.bottom button.active {
      color: var(--primary);
    }
    nav.bottom button svg {
      width: 24px;
      height: 24px;
    }

    .screen {
      flex: 1;
      padding: 16px 16px 90px;
      overflow-y: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .card-photo {
      height: 280px;
      background: linear-gradient(135deg, #006600 0%, #004d00 50%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 4rem;
      font-weight: 700;
      position: relative;
    }
    .card-photo .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.45);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .card-body {
      padding: 18px;
    }
    .card-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .card-bio {
      font-size: 14px;
      color: #444;
      margin-bottom: 12px;
      line-height: 1.55;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tag {
      background: #e8f5e9;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .card-actions {
      display: flex;
      gap: 12px;
    }
    .card-actions .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
    }
    .btn-like {
      background: var(--primary);
      color: white;
    }
    .btn-pass {
      background: #f3f4f6;
      color: #555;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty h3 {
      margin-bottom: 8px;
      color: var(--text);
    }

    .match-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .match-item:hover { background: #f9fafb; }
    .match-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 20px;
      flex-shrink: 0;
    }
    .match-info h4 {
      font-size: 16px;
      font-weight: 600;
    }
    .match-info p {
      font-size: 13px;
      color: var(--muted);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .chat-header button {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 4px;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
    }
    .msg.mine {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.theirs {
      align-self: flex-start;
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
      position: sticky;
      bottom: 80px;
      background: var(--bg);
      padding-top: 8px;
    }
    .chat-input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-size: 15px;
      font-family: inherit;
    }
    .chat-input-row button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 auto 12px;
    }
    .profile-form .form-group {
      margin-bottom: 14px;
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { opacity: 1; }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-bar select {
      padding: 8px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      font-size: 13px;
      font-family: inherit;
      background: white;
    }

    @media (min-width: 500px) {
      #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <div id="auth-screen">
    <div class="logo">Nia<span>.</span></div>
    <div class="tagline">Find your person in Kenya 🇰🇪</div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')">Login</button>
        <button id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="login-phone" placeholder="0712 345 678" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
        <div class="error-msg" id="login-error"></div>
      </form>

      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="e.g. Amina Wanjiku" required />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="0712 345 678" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Min 6 characters" minlength="6" required />
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="reg-age" min="18" max="80" placeholder="25" required />
        </div>
        <div class="form-group">
          <label>I am</label>
          <select id="reg-gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Looking for</label>
          <select id="reg-looking" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Any">Anyone</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location</label>
          <select id="reg-location" required>
            <option value="">Select city</option>
            <option value="Nairobi">Nairobi</option>
            <option value="Mombasa">Mombasa</option>
            <option value="Kisumu">Kisumu</option>
            <option value="Nakuru">Nakuru</option>
            <option value="Eldoret">Eldoret</option>
            <option value="Thika">Thika</option>
            <option value="Malindi">Malindi</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tribe (optional)</label>
          <input type="text" id="reg-tribe" placeholder="e.g. Kikuyu, Luo, Kalenjin..." />
        </div>
        <div class="form-group">
          <label>Short Bio</label>
          <textarea id="reg-bio" rows="2" placeholder="Tell people about yourself..."></textarea>
        </div>
        <div class="form-group">
          <label>Interests (comma separated)</label>
          <input type="text" id="reg-interests" placeholder="Travel, Music, Football..." />
        </div>
        <button type="submit" class="btn btn-primary" id="reg-btn">Create Account</button>
        <div class="error-msg" id="reg-error"></div>
      </form>

      <div class="demo-hint">
        <strong>Demo accounts</strong> (password: <code>demo123</code>)<br>
        0712 000 001 – Amina (Nairobi)<br>
        0712 000 002 – Brian (Kisumu)
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="brand">Nia<span>.</span></div>
      <div class="header-actions">
        <div class="avatar-small" id="header-avatar" onclick="showScreen('profile')">?</div>
      </div>
    </header>

    <div id="screen-discover" class="screen">
      <div class="filter-bar">
        <select id="filter-location" onchange="loadDiscover()">
          <option value="All">All Kenya</option>
          <option value="Nairobi">Nairobi</option>
          <option value="Mombasa">Mombasa</option>
          <option value="Kisumu">Kisumu</option>
          <option value="Nakuru">Nakuru</option>
          <option value="Eldoret">Eldoret</option>
        </select>
      </div>
      <div id="discover-list"></div>
    </div>

    <div id="screen-matches" class="screen hidden">
      <h2 style="margin-bottom:16px;font-size:1.3rem;">Your Matches</h2>
      <div id="matches-list"></div>
    </div>

    <div id="screen-chat" class="screen hidden">
      <div class="chat-header">
        <button onclick="showScreen('matches')">←</button>
        <div>
          <strong id="chat-name">Chat</strong>
          <div style="font-size:12px;color:#666;" id="chat-meta"></div>
        </div>
      </div>
      <div class="messages" id="messages-box"></div>
      <div class="chat-input-row">
        <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()" />
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>

    <div id="screen-profile" class="screen hidden">
      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar">?</div>
        <h2 id="profile-name">Your Name</h2>
        <p style="color:#666;font-size:14px;" id="profile-meta"></p>
      </div>

      <div class="profile-form">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="edit-name" />
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="edit-age" min="18" max="80" />
        </div>
        <div class="form-group">
          <label>Location</label>
          <select id="edit-location">
            <option value="Nairobi">Nairobi</option>
            <option value="Mombasa">Mombasa</option>
            <option value="Kisumu">Kisumu</option>
            <option value="Nakuru">Nakuru</option>
            <option value="Eldoret">Eldoret</option>
            <option value="Thika">Thika</option>
            <option value="Malindi">Malindi</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tribe</label>
          <input type="text" id="edit-tribe" />
        </div>
        <div class="form-group">
          <label>Bio</label>
          <textarea id="edit-bio" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Interests (comma separated)</label>
          <input type="text" id="edit-interests" />
        </div>
        <button class="btn btn-primary" onclick="saveProfile()" style="margin-bottom:12px;">Save Changes</button>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <nav class="bottom">
      <button id="nav-discover" class="active" onclick="showScreen('discover')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Discover
      </button>
      <button id="nav-matches" onclick="showScreen('matches')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Matches
      </button>
      <button id="nav-profile" onclick="showScreen('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </button>
    </nav>
  </div>

  <script>
    let token = localStorage.getItem('nia_token') || null;
    let currentUser = null;
    let currentMatchId = null;
    let currentChatUser = null;

    function toast(msg, duration = 2800) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), duration);
    }

    function initials(name) {
      if (!name) return '?';
      return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch('/api' + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
      document.getElementById('login-error').textContent = '';
      document.getElementById('reg-error').textContent = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const data = await api('/login', {
          method: 'POST',
          body: JSON.stringify({
            phone: document.getElementById('login-phone').value,
            password: document.getElementById('login-password').value
          })
        });
        token = data.token;
        currentUser = data.user;
        localStorage.setItem('nia_token', token);
        showApp();
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const err = document.getElementById('reg-error');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const interests = document.getElementById('reg-interests').value;
        const data = await api('/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('reg-name').value,
            phone: document.getElementById('reg-phone').value,
            password: document.getElementById('reg-password').value,
            age: document.getElementById('reg-age').value,
            gender: document.getElementById('reg-gender').value,
            lookingFor: document.getElementById('reg-looking').value,
            location: document.getElementById('reg-location').value,
            tribe: document.getElementById('reg-tribe').value,
            bio: document.getElementById('reg-bio').value,
            interests: interests
          })
        });
        token = data.token;
        currentUser = data.user;
        localStorage.setItem('nia_token', token);
        toast('Welcome to Nia! 🎉');
        showApp();
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    function logout() {
      token = null;
      currentUser = null;
      localStorage.removeItem('nia_token');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
    }

    async function showApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      updateHeader();
      showScreen('discover');
      loadDiscover();
    }

    function updateHeader() {
      if (!currentUser) return;
      document.getElementById('header-avatar').textContent = initials(currentUser.name);
    }

    function showScreen(name) {
      ['discover', 'matches', 'chat', 'profile'].forEach(s => {
        document.getElementById('screen-' + s).classList.toggle('hidden', s !== name);
      });
      document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
      const nav = document.getElementById('nav-' + (name === 'chat' ? 'matches' : name));
      if (nav) nav.classList.add('active');

      if (name === 'matches') loadMatches();
      if (name === 'profile') loadProfileForm();
      if (name === 'discover') loadDiscover();
    }

    async function loadDiscover() {
      const list = document.getElementById('discover-list');
      list.innerHTML = '<div class="empty"><p>Loading people...</p></div>';

      try {
        const location = document.getElementById('filter-location').value;
        const people = await api('/discover?location=' + encodeURIComponent(location));
        if (people.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <h3>No more people right now</h3>
              <p>Try changing the location filter or check back later.</p>
            </div>`;
          return;
        }

        list.innerHTML = people.map(p => `
          <div class="card" id="card-${p.id}">
            <div class="card-photo">
              ${initials(p.name)}
              <div class="badge">${p.location}</div>
            </div>
            <div class="card-body">
              <div class="card-name">${p.name}, ${p.age}</div>
              <div class="card-meta">${p.tribe ? p.tribe + ' · ' : ''}${p.gender}</div>
              <div class="card-bio">${p.bio || 'No bio yet.'}</div>
              <div class="tags">
                ${(p.interests || []).map(i => `<span class="tag">${i}</span>`).join('')}
              </div>
              <div class="card-actions">
                <button class="btn btn-pass" onclick="passUser('${p.id}')">Pass</button>
                <button class="btn btn-like" onclick="likeUser('${p.id}')">♥ Like</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (ex) {
        list.innerHTML = `<div class="empty"><p>${ex.message}</p></div>`;
      }
    }

    function passUser(id) {
      const card = document.getElementById('card-' + id);
      if (card) {
        card.style.opacity = '0';
        card.style.transform = 'translateX(-40px)';
        card.style.transition = 'all 0.3s';
        setTimeout(() => card.remove(), 300);
      }
    }

    async function likeUser(id) {
      try {
        const res = await api('/like', {
          method: 'POST',
          body: JSON.stringify({ toId: id })
        });
        if (res.matched) {
          toast("🎉 It's a Match!");
        } else {
          toast('Liked!');
        }
        passUser(id);
      } catch (ex) {
        toast(ex.message);
      }
    }

    async function loadMatches() {
      const list = document.getElementById('matches-list');
      list.innerHTML = '<div class="empty"><p>Loading matches...</p></div>';

      try {
        const matches = await api('/matches');
        if (matches.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <h3>No matches yet</h3>
              <p>Keep liking people on Discover. When they like you back, you’ll see them here!</p>
            </div>`;
          return;
        }

        list.innerHTML = matches.map(m => `
          <div class="match-item" onclick='openChat("${m.matchId}", ${JSON.stringify(m.user)})'>
            <div class="match-avatar">${initials(m.user.name)}</div>
            <div class="match-info">
              <h4>${m.user.name}</h4>
              <p>${m.user.location} · ${m.user.age}</p>
            </div>
          </div>
        `).join('');
      } catch (ex) {
        list.innerHTML = `<div class="empty"><p>${ex.message}</p></div>`;
      }
    }

    function openChat(matchId, user) {
      currentMatchId = matchId;
      currentChatUser = user;
      document.getElementById('chat-name').textContent = user.name;
      document.getElementById('chat-meta').textContent = user.location + ' · ' + user.age;
      showScreen('chat');
      loadMessages();
    }

    async function loadMessages() {
      const box = document.getElementById('messages-box');
      box.innerHTML = '';

      try {
        const msgs = await api('/messages/' + currentMatchId);
        msgs.forEach(m => {
          const div = document.createElement('div');
          div.className = 'msg ' + (m.senderId === currentUser.id ? 'mine' : 'theirs');
          const time = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          div.innerHTML = m.content + '<div class="msg-time">' + time + '</div>';
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      } catch (ex) {
        toast(ex.message);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content || !currentMatchId) return;

      try {
        await api('/messages', {
          method: 'POST',
          body: JSON.stringify({ matchId: currentMatchId, content })
        });
        input.value = '';
        loadMessages();
      } catch (ex) {
        toast(ex.message);
      }
    }

    function loadProfileForm() {
      if (!currentUser) return;
      document.getElementById('profile-avatar').textContent = initials(currentUser.name);
      document.getElementById('profile-name').textContent = currentUser.name;
      document.getElementById('profile-meta').textContent =
        currentUser.age + ' · ' + currentUser.location + (currentUser.tribe ? ' · ' + currentUser.tribe : '');

      document.getElementById('edit-name').value = currentUser.name || '';
      document.getElementById('edit-age').value = currentUser.age || '';
      document.getElementById('edit-location').value = currentUser.location || 'Nairobi';
      document.getElementById('edit-tribe').value = currentUser.tribe || '';
      document.getElementById('edit-bio').value = currentUser.bio || '';
      document.getElementById('edit-interests').value = (currentUser.interests || []).join(', ');
    }

    async function saveProfile() {
      try {
        const interests = document.getElementById('edit-interests').value
          .split(',').map(i => i.trim()).filter(Boolean);

        const updated = await api('/profile', {
          method: 'PUT',
          body: JSON.stringify({
            name: document.getElementById('edit-name').value,
            age: parseInt(document.getElementById('edit-age').value),
            location: document.getElementById('edit-location').value,
            tribe: document.getElementById('edit-tribe').value,
            bio: document.getElementById('edit-bio').value,
            interests
          })
        });
        currentUser = updated;
        updateHeader();
        loadProfileForm();
        toast('Profile updated ✓');
      } catch (ex) {
        toast(ex.message);
      }
    }

    async function init() {
      if (token) {
        try {
          currentUser = await api('/me');
          showApp();
        } catch {
          localStorage.removeItem('nia_token');
          token = null;
        }
      }
    }

    init();
  </script>
</body>
</html>
